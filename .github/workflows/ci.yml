name: STM32 EMBEDDED PROJECT

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Configure
      run: cmake -S . -B build -DWARNINGS_AS_ERRORS=ON

    - name: Build
      run: cmake --build build

    - name: Run tests
      run: ctest --test-dir build --output-on-failure

  build-arm:
    runs-on: ubuntu-latest
    steps:
    
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install ARM GNU Toolchain
      uses: carlosperate/arm-none-eabi-gcc-action@v1
      with:
        release: '15.3.Rel1'

    - name: Configure (ARM toolchain) 
      run: cmake -S . -B build-arm -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi.cmake -DWARNINGS_AS_ERRORS=ON

    - name: Build firmware
      run: cmake --build build-arm

    - name: Size report
      run: |
        arm-none-eabi-size build-arm/firmware.elf
        {
          echo '### Firmware size'
          echo '```'
          arm-none-eabi-size build-arm/firmware.elf
          echo '```'
          echo '`text` + `data` occupies Flash (32 KB). `data` + `bss` occupies SRAM (12 KB).'
        } >> "$GITHUB_STEP_SUMMARY"

  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install clang-tidy and cppcheck
      run: sudo apt-get install -y clang-tidy cppcheck

    - name: Configure
      run: cmake -S . -B build

    - name: Run clang-tidy
      run: >
        clang-tidy -p build --quiet --warnings-as-errors='*'
        app/main.c drivers/src/*.c tests/*.cpp

    - name: Run cppcheck
      run: >
        cppcheck --enable=warning,style,performance,portability
        --error-exitcode=1 --suppressions-list=.cppcheck-suppressions
        --quiet -Idrivers/include drivers/ app/
